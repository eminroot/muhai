<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Muhai — Türk KOBİ'leri için yapay zeka destekli muhasebe ve finansal yönetim platformu." />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1524" media="(prefers-color-scheme: dark)" />

    <!-- Three requests, not one: a failure on any cannot take the others down.
         Cal Sans carries the headings, Manrope everything else, Plex Mono the
         machine text. Cal Sans ships a single weight on purpose. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Inter carries the signed-in console, which follows a different design
         language from the marketing pages (see styles/console.css). The
         landing page and the auth screens stay on Cal Sans + Manrope. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Paint the stored theme before anything else, or a dark-mode user gets
         a white flash on every reload. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('muhai.theme')
          var dark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>

    <title>Muhai · Muhasebe konsolu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
