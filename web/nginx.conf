# ============================================================
# Muhai web — static SPA + API reverse proxy.
#
# One origin for everything the browser touches. That removes CORS from the
# production picture entirely and means the built bundle contains no
# hard-coded API host.
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # OCR uploads are capped at 10 MB by the API; nginx must not reject them
    # first with its 1 MB default.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # Vite fingerprints every asset filename, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The vendored Tesseract worker, wasm cores and language data. Large,
    # immutable, and deliberately not fetched from a CDN (see N13).
    location /tessdata/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A Prophet forecast or a Tesseract scan can take the better part of a
        # minute on a small VPS. The browser client times out well before this.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # index.html itself must never be cached, or a deploy leaves browsers
    # loading asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Client-side routing: every unknown path is an app route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
